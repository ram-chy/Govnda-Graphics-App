[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gobindas-bms"
version = "0.2.0"
description = "Gobindas Graphics Business Management System - offline Windows desktop application"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "LicenseRef-Proprietary"
authors = [{ name = "Gobindas Graphics" }]
dependencies = [
    "PySide6~=6.12.0",
    "SQLAlchemy~=2.1.8",
    "alembic~=1.20.1",
    "pydantic~=2.14.3",
    "pyqtgraph~=0.14.0",
    "reportlab~=5.1.0",
    "openpyxl~=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2.0",
    "ruff~=0.17.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
