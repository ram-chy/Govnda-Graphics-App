# Alembic configuration for the Gobindas Graphics Business Management System.
#
# The database URL is never configured here. It is injected at runtime from the
# application's configured absolute database path (see
# app/infrastructure/database/migrations.py). This file exists so standard
# Alembic command-line workflows keep working during development.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Silence "no config file" warnings in headless tooling.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
